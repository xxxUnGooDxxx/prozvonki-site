<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">REC</title>
  <desc id="desc">Red recording dot and REC label</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#991b1b" flood-opacity=".16"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="116" cy="256" r="64" fill="#ef4444"/>
    <circle cx="116" cy="256" r="84" fill="none" stroke="#ef4444" stroke-width="12" opacity=".2"/>
    <text x="216" y="294" fill="#ef4444" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="800" letter-spacing="5">REC</text>
  </g>
</svg>
